<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情包图库</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #1e1e2f, #121212);
  color: white;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 22px;
}

button {
  background: #4f46e5;
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #6366f1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
  padding: 12px;
}

.card {
  overflow: hidden;
  border-radius: 12px;
  background: #222;
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-4px) scale(1.03);
}

img {
  width: 100%;
  display: block;
}

/* 放大预览 */
.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
}

.viewer img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

.viewer.show {
  display: flex;
}
</style>
</head>
<body>

<header>
  <h1>📦 表情包仓库</h1>
  <button onclick="showRandom()">🎲 随机来一张</button>
</header>

<div class="grid" id="gallery"></div>

<div class="viewer" id="viewer" onclick="this.classList.remove('show')">
  <img id="viewerImg">
</div>

<script>
let images = [];

fetch('images.json')
  .then(res => res.json())
  .then(data => {
    images = data;
    const gallery = document.getElementById('gallery');

    data.forEach(file => {
      const div = document.createElement('div');
      div.className = 'card';

      const img = document.createElement('img');
      img.src = 'images/' + file;
      img.loading = 'lazy';

      img.onclick = () => {
        document.getElementById('viewerImg').src = img.src;
        document.getElementById('viewer').classList.add('show');
      };

      div.appendChild(img);
      gallery.appendChild(div);
    });
  });

function showRandom() {
  if (images.length === 0) return;
  const rand = images[Math.floor(Math.random() * images.length)];
  const src = 'images/' + rand;

  document.getElementById('viewerImg').src = src;
  document.getElementById('viewer').classList.add('show');
}
</script>

</body>
</html>
